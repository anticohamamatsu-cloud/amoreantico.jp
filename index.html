<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amore Antico</title>
  <meta name="description" content="Amore Antico — Work in progress.">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #171717;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    main {
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>Amore Antico</h1>
    <p>Work in progress</p>
